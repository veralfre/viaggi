name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Chiamato da voli.yml dopo il commit dei prezzi: i push fatti con
  # GITHUB_TOKEN non fanno partire i workflow "on: push".
  workflow_call:
    inputs:
      ref:
        description: Commit da pubblicare (vuoto = quello che ha avviato il workflow)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
