name: Prezzi voli

# Ogni due giorni cerca i prezzi dei voli dei viaggi attivi (src/viaggi.js),
# aggiunge le righe a public/<slug>/voli.csv e ripubblica il sito.
on:
  schedule:
    - cron: '17 5 */2 * *'
  workflow_dispatch:
    inputs:
      calibra:
        description: Verifica se il prezzo è totale o a persona (2 ricerche, non scrive)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: voli
  cancel-in-progress: false

jobs:
  prezzi:
    # Solo da main: da un altro ramo il push finirebbe comunque su main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cerca i prezzi
        run: node scripts/voli.mjs ${{ inputs.calibra && '--calibra' || '' }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Salva lo storico
        id: commit
        if: success() || failure()
        run: |
          shopt -s nullglob
          files=(public/*/voli.csv)
          if [ ${#files[@]} -gt 0 ]; then git add -- "${files[@]}"; fi
          if git diff --cached --quiet; then
            echo "Nessun prezzo nuovo da salvare"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prezzi voli $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prezzi
    if: ${{ !cancelled() && needs.prezzi.outputs.changed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      # main e non lo SHA del commit: se nel frattempo qualcuno ha pushato, si pubblica l'ultimo stato.
      ref: main
